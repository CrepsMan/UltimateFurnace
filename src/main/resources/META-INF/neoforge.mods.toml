modLoader = "javafml"
loaderVersion = "*"
issueTrackerURL = "https://github.com/CrepsMan/UltimateFurnace/issues"
license = "CC0-1.0"

[[mods]]
modId = "${id}"
version = "${version}"
displayName = "${name}"
authors = "CrepsMan"
description = '''
${description}
'''
logoFile = "assets/${id}/icon.png"
logoBlur = false

[[dependencies.${id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforgeLoaderVersion},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${id}]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraftVersion}]"
ordering = "NONE"
side = "BOTH"
